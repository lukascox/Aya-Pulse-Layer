name: Release APK

# Cuts a public GitHub Release with a signed release APK attached, so anyone
# can download it without a GitHub account -- unlike the build.yml artifact,
# which expires after 90 days and requires a login.
#
# TRIGGER: push a tag starting with v, e.g.
#   git tag -a v1.19.6-aya.1 -m "first tester build" && git push github v1.19.6-aya.1
# The tag has to be pushed to the GitHub remote specifically; this repo's
# primary remote is a private Forgejo instance, and Actions only sees GitHub.
#
# REQUIRED SECRETS (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    the .jks, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# app/build.gradle.kts reads the last three straight from the environment via
# signingProperty(), so no Gradle changes are needed. If the secrets are
# absent, hasReleaseSigningConfig goes false and the build produces an
# UNSIGNED apk that will not install -- so this workflow fails fast instead.
#
# KEYSTORE WARNING: whatever key signs the first release must sign every
# release after it, forever. Android refuses to update an app signed by a
# different key. Losing the .jks means every tester has to uninstall and lose
# their settings. Back it up somewhere that is not only this machine.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: research/pulse-for-aya

permissions:
  contents: write   # needed to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if signing secrets are missing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP ALIAS KP; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing signing secret ($v). An unsigned APK cannot be installed; refusing to publish one."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: research/pulse-for-aya

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          test -s release.jks

      - name: Build signed release APK
        env:
          # Consumed by signingProperty() in app/build.gradle.kts.
          # Path is resolved with rootProject.file(), i.e. relative to
          # research/pulse-for-aya/, which is where the decode step wrote it.
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is actually signed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$apk"
          mv "$apk" "pulse-for-aya-${GITHUB_REF_NAME}.apk"

      - name: Shred the keystore
        if: always()
        run: rm -f release.jks

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        # DO NOT hard-wrap the release notes in the heredoc below, however long the lines get.
        # Release bodies render in GitHub's comment flavour, where every newline inside a paragraph
        # becomes a literal <br> -- so 80-column text comes out as a narrow ragged column instead of
        # filling the page (v1.19.6-aya.1 shipped that way). Repo .md files are NOT affected: they
        # render with breaks off, which is why README.md stays wrapped and still looks right. This
        # is specific to releases, issues and comments.
        # Verified with: gh api /markdown -f mode=gfm -f text=... versus -f mode=markdown
        #
        # NOT --prerelease, deliberately (dropped for aya.2). GitHub does not treat a pre-release as
        # a release: /releases/latest 404s while every release is one, and the repo sidebar shows no
        # "Latest" link. Verified against this repo while aya.1 was the only tag. The honesty work is
        # done properly in the notes and README, which say far more than a badge does; keeping the
        # badge only cost the one link people actually share.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "pulse-for-aya-${GITHUB_REF_NAME}.apk" \
            --title "PULSE for KONKR Pocket FIT $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file - <<'EOF'
          **Experimental. Installing this is at your own risk.**

          A glue patch on [`pulse`](https://github.com/keiretrogaming/pulse) (GPL-2.0) for the **KONKR Pocket FIT** — the handheld whose own firmware calls itself `AYANEO Pocket FIT`. `pulse` is upstream's app and this is not a fork of it; the work here is the glue that lets it talk to this hardware. Tested on exactly two devices, both mine. Not a finished product.

          It writes to privileged system settings and to fan control. This project's history includes crashes and reboots needing a hard power cycle. A signed build only means the file came from the code in the repo; it does not make any of that safer.

          **Hardware:** from this version the app reads the SoC vendor at startup and refuses to run on anything that is not Qualcomm — no privileged write, no vendor service binding. That blocks an architecture this was never run on at all. It does NOT mean other Snapdragon handhelds are supported; they are simply untested.

          **Version scheme:** `<upstream pulse version>-aya.<n>`. So this build is upstream `pulse` at the stated version, plus this repo's n-th published set of patches.

          **Release builds do not write session logs.** Nothing is written to `/sdcard/apl_pulse_logs/`. Debug builds do, at roughly 3-4 MB per hour, and do not clean up after themselves.

          **Known open issues at the time of this build:**
          - Turning the Sleep feature on has been followed, in two sessions out of two, by the app process being killed repeatedly shortly after start. With Sleep off, a third session ran nearly two hours clean. The cause is not established. **Leave Sleep off.**
          - AutoTDP has been seen to raise clocks as well as trim them, but on too few decisions to say how it behaves in any given game. If a title misbehaves under it, a fixed tier is the dependable option — that is what the test devices use for emulators. Whether its weak spots are specific to this hardware is an open question; comparing against upstream `pulse` on another Snapdragon handheld would answer it. Not a priority.
          - A per-app fan mode silently overrides the global Custom fan card, with nothing in the UI saying so.
          - Joystick RGB is out of scope and does nothing.

          **This is a research project, published because the findings might be useful — not a supported product.** There is no issue triage and no support. `STATUS.md` in the repo is the honest current state, including the conclusions that later turned out to be wrong.
          EOF
